<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Pup Café Launch Costs</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{font-family:Segoe UI,Arial;background:#eaf8de;color:#3d5a40;text-align:center;padding:2rem}
select{padding:.5rem;border-radius:6px;margin-bottom:1rem}
canvas{max-width:500px;margin:0 auto}
table{margin:1.5rem auto;border-collapse:collapse}
th,td{padding:.4rem 1rem;border-bottom:1px solid #ccc}
th{background:#3d5a40;color:#fff}
</style></head><body>
<h1>Launch‑Cost Breakdown</h1>
<select id="tierSelect"></select>
<canvas id="chart"></canvas>
<table id="tbl"><thead><tr><th>Category</th><th>$</th></tr></thead><tbody></tbody></table>

<script>
let chart;
fetch('metrics.json').then(r=>r.json()).then(d=>{
  const sel=document.getElementById('tierSelect');
  Object.keys(d.totals).forEach(t=>{
    sel.add(new Option(t.charAt(0).toUpperCase()+t.slice(1),t));
  });
  sel.value=d.default;
  sel.onchange=()=>draw(sel.value);
  draw(d.default);
  function draw(tier){
    const data=d.tiers[tier];
    const ctx=document.getElementById('chart');
    if(chart)chart.destroy();
    chart=new Chart(ctx,{
      type:'doughnut',
      data:{labels:Object.keys(data),datasets:[{data:Object.values(data)}]},
      options:{plugins:{legend:{position:'bottom'}}}
    });
    // table
    const tb=document.querySelector('#tbl tbody');
    tb.innerHTML='';
    Object.entries(data).forEach(([k,v])=>{
      tb.insertAdjacentHTML('beforeend',
        `<tr><td>${k.replace(/_/g,' ')}</td><td>$${v.toLocaleString()}</td></tr>`);
    });
  }
});
</script>
</body></html>
